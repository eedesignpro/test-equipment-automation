[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "drivers"
version = "0.4.0"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that require a physical instrument (deselect with '-m \"not hardware\"')",
]
addopts = "-m 'not hardware'"